name: Frontend

on:
  pull_request:
  # Deployments fetch the build artifact for the branch they track, so the
  # deployed branch needs a build on push and not only through its pull
  # request.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: { group: trusted-linux, labels: [self-hosted, linux, x64, bdd] }
    timeout-minutes: 20
    env:
      # Carried over from GitLab, where it is exported before `yarn build`,
      # and kept deliberately.
      NODE_ENV: development
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Build
        working-directory: frontend
        run: |
          corepack enable
          yarn install --immutable
          yarn build

      - name: Upload build output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14
